[package]
name = "fourghz"
version = "0.1.0"
description = "An unofficial Windows app with schedules, redeem codes, and a chore calendar"
authors = ["Cocos Nucifera"]
license = "MIT"
repository = "https://github.com/dev1f965x/4ghz"
edition = "2024"
publish = false

[lib]
# Keeps the library and binary names distinct. The app version comes from package.json (tauri.conf.json).
name = "fourghz_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

# Smaller installer; see https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
