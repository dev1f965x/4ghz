# cargo-deny: licenses and security advisories for the Rust dependencies.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
ignore = []

[licenses]
# Permissive licenses only (handbook allow-list), plus the recorded MPL-2.0 exceptions below.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
  "Unicode-3.0",
]
confidence-threshold = 0.9
# The list mirrors the handbook policy, so not every entry is in use at any time.
unused-allowed-license = "allow"
exceptions = [
  # Shipped unmodified through tauri -> dirs; notice and source link are in the third-party notices.
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # Build time only, through tauri-utils in tauri-codegen and tauri-macros; not in the binary.
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  { allow = ["MPL-2.0"], crate = "selectors" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
