# cargo-about: third-party notices for the Rust crates in the app.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Proc-macro dependencies (such as tauri-macros) are normal edges to cargo-about, so their build-time
# crates are listed too. Listing more than ships is harmless.
