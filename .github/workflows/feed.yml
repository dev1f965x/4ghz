name: Feed

on:
  push:
    branches: [main]
    paths: [feed/**, .github/workflows/feed.yml]
  workflow_dispatch:

concurrency:
  group: feed
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate
        run: npm run feed:validate
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: feed
      - id: deploy
        uses: actions/deploy-pages@v5
