name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node.js, pnpm, cargo-deny, and cargo-about from mise.toml, the same versions as local development.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2

      # Installs the toolchain and components that rust-toolchain.toml names.
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      # Frontend end-to-end and accessibility tests in the runner's Microsoft Edge (WebView2's engine).
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Build the installer
        run: pnpm app:build

      - name: Check the installer size
        shell: pwsh
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $mb = [math]::Round($installer.Length / 1MB, 2)
          "Installer: $($installer.Name), $mb MB"
          # Performance target: the installer stays under 10 MB.
          if ($installer.Length -ge 10MB) { throw "Installer is $mb MB; the limit is 10 MB." }

      # The packaged app through tauri-driver: starts, restarts, and reports no CSP violations.
      - name: Packaged-app smoke test
        run: pnpm test:app
