name: Release

# A version tag (v0.1.0) builds the installer from that commit and attaches it, its SHA-256
# checksum, and a build provenance attestation to a draft release. The owner reviews the draft
# and publishes it by hand.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation through Sigstore
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          # A release never restores a cache that other runs could have written.
          cache: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # No Rust build cache either: a release builds from a clean state.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the app version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match package.json version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check
        run: pnpm check

      - name: Build the installer
        run: pnpm app:build

      - name: Write the checksum and the release notes
        id: files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          # The format sha256sum -c reads: hash, two spaces, file name.
          "$hash  $($installer.Name)" | Set-Content -NoNewline -Encoding ascii "$($installer.FullName).sha256"
          # The notes are this version's CHANGELOG section, without its heading or the link list.
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $env:VERSION." }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding utf8 release-notes.md
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.installer }}

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.files.outputs.installer }}
        run: |
          gh release create $env:TAG --draft --verify-tag --title "4GHz $env:VERSION" `
            --notes-file release-notes.md $env:INSTALLER "$env:INSTALLER.sha256"
