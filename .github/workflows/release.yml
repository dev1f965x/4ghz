name: Release

# A version tag (v0.1.0) on a commit of main builds the installer from that commit and attaches
# it, its SHA-256 checksum, and a build provenance attestation to a draft release. The owner
# reviews the draft and publishes it by hand.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release
      id-token: write # sign the attestation through Sigstore
      attestations: write
      artifact-metadata: write
    steps:
      # Full history, to check below that the tagged commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Fails before any setup: a wrong tag, a commit off main, or a release that already exists.
      - name: Check the tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match package.json version $version." }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:TAG is not on main; tag a merged commit." }
          # A re-run would add a second draft with a different build; delete the old one first.
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "A release for $env:TAG already exists; delete it before running again." }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          # A release never restores a cache that other runs could have written.
          cache: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # No Rust build cache either: a release builds from a clean state.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gates as CI, on the exact commit that ships.
      - name: Check
        run: pnpm check

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build the installer
        run: pnpm app:build

      - name: Check the installer size
        shell: pwsh
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $mb = [math]::Round($installer.Length / 1MB, 2)
          "Installer: $($installer.Name), $mb MB"
          if ($installer.Length -ge 10MB) { throw "Installer is $mb MB; the limit is 10 MB." }

      - name: Build the app for the smoke test
        run: pnpm app:build:e2e

      - name: Packaged-app smoke test
        run: pnpm test:app

      - name: Write the checksum and the release notes
        id: files
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          # The format sha256sum -c reads: hash, two spaces, file name.
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          # The notes are this version's CHANGELOG section, without its heading or the link list.
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $env:VERSION." }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding utf8 release-notes.md
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.installer }}

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER: ${{ steps.files.outputs.installer }}
        run: |
          gh release create $env:TAG --draft --verify-tag --title "4GHz $env:VERSION" `
            --notes-file release-notes.md $env:INSTALLER "$env:INSTALLER.sha256"
